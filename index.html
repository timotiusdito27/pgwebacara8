<!DOCTYPE html>
<html>
<body>
<h2>Form Input</h2>
<form action="input.php" onsubmit="return validateForm(event)" method="post">
    <label for="kec">Kecamatan:</label><br>
    <input type="text" id="kec" name="kecamatan" value=""><br>

    <label for="long">Longitude:</label><br>
    <input type="text" id="long" name="longitude" value=""><br>

    <label for="lat">Latitude:</label><br>
    <input type="text" id="lat" name="latitude" value=""><br>

    <label for="luas">Luas:</label><br>
    <input type="text" id="luas" name="luas" value=""><br>

    <label for="jml_ppdk">Jumlah Penduduk:</label><br>
    <input type="text" id="jml_ppdk" name="jumlah_penduduk" value=""><br><br>

    <input type="submit" value="Submit">
</form>

<p id="informasi" style="color: red;"></p>

<script>
function validateForm(event) {
    let luas = document.getElementById("luas").value;
    let text = "";
    
    if (isNaN(luas) || luas < 1) {
        text = "Data luas harus angka dan tidak boleh bernilai negatif";
        // stop the form submission[span_9](start_span)[span_9](end_span)
        event.preventDefault();
        document.getElementById("informasi").innerHTML = text;
        return false;
    }
    return true;
}
</script>
</body>
</html>
